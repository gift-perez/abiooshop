# Render Blueprint: https://render.com/docs/blueprint-spec
# Free web service built from the Dockerfile. The database is external
# (Neon free Postgres). Render's free Postgres is deleted after 30 days.
services:
  - type: web
    name: abiooshop
    runtime: docker
    plan: free
    region: singapore    # same region as the Neon database (AWS ap-southeast-1)
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ABIIO SHOP
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # paste output of: php artisan key:generate --show
      - key: APP_URL
        sync: false          # e.g. https://abiooshop.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false          # Neon connection string (postgresql://...?sslmode=require)
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: BROADCAST_CONNECTION
        value: "null"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: MAIL_MAILER
        value: log
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
